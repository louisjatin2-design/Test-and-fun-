[project]
name = "warhammer-meta"
version = "0.1.0"
description = "Self-gehosteter Listenbuilder mit Regel-Inspektor für Warhammer 40.000"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wh-etl = "app.etl.wahapedia:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
